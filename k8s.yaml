apiVersion: v1
kind: Namespace
metadata:
  name: webidentification
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium
  namespace: webidentification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium
  template:
    metadata:
      labels:
        app: selenium
    spec:
      containers:
        - name: selenium
          image: selenium/standalone-chrome:4.31.0
          ports:
            - containerPort: 4444
            - containerPort: 7900
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: selenium
  namespace: webidentification
spec:
  selector:
    app: selenium
  ports:
    - name: webdriver
      port: 4444
      targetPort: 4444
    - name: vnc
      port: 7900
      targetPort: 7900
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend
  namespace: webidentification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-backend
  template:
    metadata:
      labels:
        app: model-backend
    spec:
      containers:
        - name: model-backend
          image: ghcr.io/uplink036/webidentification-model-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: model-backend
  namespace: webidentification
spec:
  selector:
    app: model-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webidentification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/uplink036/webidentification-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8010
          env:
            - name: MODEL_SERVER_URL
              value: "http://model-backend:8000/predict_draw"
            - name: SELENIUM_REMOTE_URL
              value: "http://selenium:4444/wd/hub"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: webidentification
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8010
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: webidentification
  namespace: webidentification
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: webidentification
spec:
  parentRefs:
    - name: webidentification
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-backend
  namespace: webidentification
spec:
  parentRefs:
    - name: webidentification
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: model-backend
          port: 8000