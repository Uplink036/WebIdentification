apiVersion: v1
kind: Namespace
metadata:
  name: webidentification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium
  namespace: webidentification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium
  template:
    metadata:
      labels:
        app: selenium
    spec:
      containers:
        - name: selenium
          image: selenium/standalone-chrome:4.31.0
          ports:
            - containerPort: 4444
            - containerPort: 7900
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: selenium
  namespace: webidentification
spec:
  selector:
    app: selenium
  ports:
    - name: webdriver
      port: 4444
      targetPort: 4444
    - name: vnc
      port: 7900
      targetPort: 7900
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend
  namespace: webidentification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-backend
  template:
    metadata:
      labels:
        app: model-backend
    spec:
      containers:
        - name: model-backend
          image: ghcr.io/uplink036/webidentification-model-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: model-backend
  namespace: webidentification
spec:
  selector:
    app: model-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webidentification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/uplink036/webidentification-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8010
          env:
            - name: MODEL_SERVER_URL
              value: "http://model-backend:8000/predict_draw"
            - name: SELENIUM_REMOTE_URL
              value: "http://selenium:4444/wd/hub"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: webidentification
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8010
      targetPort: 8010
      nodePort: 32010
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webidentification
  namespace: webidentification
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8010